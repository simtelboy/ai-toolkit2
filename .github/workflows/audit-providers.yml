name: Providers audit

on:
  schedule:
    # 每 72 小时一次（UTC 22:37 = 北京时间次日 06:37，避开整点高峰）。
    - cron: '37 22 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: providers-audit
  cancel-in-progress: false

env:
  # 与仓库 sync-to-gitee.yml 保持一致：强制 JS actions 使用 Node 24 运行时。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Refresh providers.json free-model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 供应商 API 密钥。未在仓库 Secrets 中配置的供应商会被脚本标记为
      # status=skipped 并沿用上一期清单，不影响其它供应商审计。
      # （智谱为静态清单无需密钥；GitHub Models/deepseek 已移出清单。）
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 使用可回推 main 分支的 token（与 FreeModelFinder 同款做法）。
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run provider free-model audit
        run: node scripts/audit-providers.mjs
      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "providers-audit-bot"
          git config user.email "providers-audit-bot@users.noreply.github.com"
          git add providers.json audit.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git commit -m "chore(audit): refresh providers ${DATE}"
          git push origin HEAD:${{ github.ref_name }}
